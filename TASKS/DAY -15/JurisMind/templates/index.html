<!DOCTYPE html>
<html>
<head>
    <title>JurisMind - Legal Assistant</title>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            margin: 0;
            color: white;
        }

        .container {
            width: 60%;
            margin: auto;
            margin-top: 40px;
        }

        h1 {
            text-align: center;
            color: #38bdf8;
        }

        #chatbox {
            height: 500px;
            overflow-y: auto;
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
        }

        .user {
            text-align: right;
            margin: 10px;
            color: #93c5fd;
        }

        .bot {
            text-align: left;
            margin: 10px;
            color: #f8fafc;
            background: #334155;
            padding: 10px;
            border-radius: 8px;
            display: inline-block;
        }

        .input-box {
            margin-top: 10px;
            display: flex;
        }

        input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
        }

        button {
            padding: 12px;
            background: #22c55e;
            border: none;
            color: white;
            margin-left: 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #16a34a;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>⚖ JurisMind Legal Assistant</h1>

    <div id="chatbox"></div>

    <div class="input-box">
        <input type="text" id="msg" placeholder="Ask a legal question...">
        <button onclick="send()">Send</button>
    </div>

</div>

<script>
async function send() {

    let input = document.getElementById("msg");
    let text = input.value;

    if (!text) return;

    let chatbox = document.getElementById("chatbox");

    chatbox.innerHTML += `<div class='user'>${text}</div>`;

    input.value = "";

    let formData = new FormData();
    formData.append("query", text);

    let response = await fetch("/ask", {
        method: "POST",
        body: formData
    });

    let answer = await response.text();

    chatbox.innerHTML += `<div class='bot'>${answer}</div>`;

    chatbox.scrollTop = chatbox.scrollHeight;
}
</script>

</body>
</html>
